<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2 Gestão — sem conexão</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0D;color:#F5F5F7;font-family:Inter,system-ui,sans-serif;text-align:center}
      main{max-width:360px;padding:24px}
      h1{font-size:18px;margin:0 0 8px}
      p{font-size:14px;color:#A1A1AA;margin:0 0 20px;line-height:1.5}
      button{background:#4161FF;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão com a internet</h1>
      <p>O sistema precisa de internet para carregar os dados. Verifique sua conexão e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
